project_id = "lawbricrp"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "https://preview-1780031277244837711.vibepreview.com"
additional_redirect_urls = [
  "http://localhost:3000",
  "https://law-firm-contacts.vibepreview.com",
  "https://preview-1780031277244837711.vibepreview.com",
  "https://preview-1780031277244837711.vibepreview.com/reset-password",
]
jwt_expiry = 3600
enable_signup = true
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[functions.ghl-webhook-events]
verify_jwt = false

[functions.admin-users]
verify_jwt = false

[functions.admin-settings]
verify_jwt = false

[functions.app-location-context]
verify_jwt = false
