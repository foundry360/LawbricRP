project_id = "lawbricrp"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "https://lawbric-rp.vercel.app"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:5173",
  "http://localhost:5173/reset-password",
  "https://lawbric-rp.vercel.app",
  "https://lawbric-rp.vercel.app/reset-password",
]
jwt_expiry = 3600
enable_signup = true
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[functions.admin-users]
verify_jwt = true

[functions.assignable-users]
verify_jwt = true

[functions.admin-settings]
verify_jwt = true

[functions.app-location-context]
verify_jwt = true

[functions.create_case]
verify_jwt = true

[functions.update_case]
verify_jwt = true

[functions.delete_case]
verify_jwt = true

[functions.get_case]
verify_jwt = true

[functions.add_case_party]
verify_jwt = true

[functions.create_task]
verify_jwt = true

[functions.update_task]
verify_jwt = true

[functions.delete_task]
verify_jwt = true

[functions.create_event]
verify_jwt = true

[functions.upload_document]
verify_jwt = true

[functions.create_note]
verify_jwt = true

[functions.update_note]
verify_jwt = true

[functions.delete_note]
verify_jwt = true
